[package]
name = "s4-fullscreen"
version = "0.0.0"
edition = "2021"
publish = false

# S-4: fullscreen detection on the target monitor.
# Compares (a) geometry of the foreground window vs the monitor rect and
# (b) SHQueryUserNotificationState. Can spawn its own borderless test window.
[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
