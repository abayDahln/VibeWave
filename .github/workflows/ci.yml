# Continuous integration: formatting, lints, and tests.
#
# Runs the quality gates required by AGENTS.md on every push and pull request.
# Windows-only: the `vibewave` crate links against the Windows API (WASAPI,
# Direct2D, DirectComposition), so it cannot build on Linux or macOS runners.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-version in Cargo.toml is 1.98; `stable` is the toolchain the
      # project targets. rustfmt and clippy are added as components.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo and target/ keyed on Cargo.lock, so incremental builds
      # in CI stay fast. The Tauri workspace lives at the repo root.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
